[workspace]
members = ["crates/wallet-core", "crates/networks/litecoin", "crates/networks/bitcoin", "crates/networks/ethereum", "crates/wallet-tui", "crates/payment-api"]
resolver = "2"
exclude = ["vendor/myotis-net"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
bitcoin = { version = "=0.32.8", features = ["serde", "rand-std"] }
tempfile = "3.27"

[profile.release]
lto = "thin"
strip = true
